<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermal — Temperature Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <header>
    <div class="eyebrow">Instrument · 003</div>
    <h1>Therm<span class="accent">al</span></h1>
    <p class="sub">Enter a value, pick its unit, and convert across Celsius, Fahrenheit, and Kelvin.</p>
  </header>

  <div class="card">
    <div class="gauge-col">
      <div class="gauge">
        <div class="gauge-fill" id="gaugeFill"></div>
      </div>
      <div class="gauge-bulb" id="gaugeBulb"></div>
      <div class="gauge-label">Live<br>reading</div>
    </div>

    <div class="form-col">
      <div class="field">
        <label for="tempInput">Temperature value</label>
        <input type="text" id="tempInput" inputmode="decimal" placeholder="e.g. 21.5" autocomplete="off">
        <div class="error-msg" id="errorMsg"></div>
      </div>

      <div class="field">
        <label>Input unit</label>
        <div class="unit-row" id="unitRow">
          <button type="button" class="unit-btn active" data-unit="C">°C Celsius</button>
          <button type="button" class="unit-btn" data-unit="F">°F Fahrenheit</button>
          <button type="button" class="unit-btn" data-unit="K">K Kelvin</button>
        </div>
      </div>

      <button class="convert" id="convertBtn">Convert</button>

      <div class="results" id="results">
        <div class="result hidden-state" data-target="C">
          <div class="val" id="outC">—</div>
          <div class="unit">Celsius</div>
        </div>
        <div class="result hidden-state" data-target="F">
          <div class="val" id="outF">—</div>
          <div class="unit">Fahrenheit</div>
        </div>
        <div class="result hidden-state" data-target="K">
          <div class="val" id="outK">—</div>
          <div class="unit">Kelvin</div>
        </div>
      </div>
    </div>
  </div>

  <footer>Absolute zero: −273.15°C · −459.67°F · 0K</footer>
</div>

<script>
(function(){
  var input = document.getElementById('tempInput');
  var errorMsg = document.getElementById('errorMsg');
  var convertBtn = document.getElementById('convertBtn');
  var unitButtons = document.querySelectorAll('.unit-btn');
  var results = document.getElementById('results');
  var outC = document.getElementById('outC');
  var outF = document.getElementById('outF');
  var outK = document.getElementById('outK');
  var gaugeFill = document.getElementById('gaugeFill');
  var gaugeBulb = document.getElementById('gaugeBulb');

  var currentUnit = 'C';

  unitButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      unitButtons.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentUnit = btn.getAttribute('data-unit');
    });
  });

  function toCelsius(value, unit){
    if(unit === 'C') return value;
    if(unit === 'F') return (value - 32) * 5/9;
    if(unit === 'K') return value - 273.15;
  }

  function fromCelsius(c){
    return {
      C: c,
      F: c * 9/5 + 32,
      K: c + 273.15
    };
  }

  function formatVal(n){
    var rounded = Math.round(n * 100) / 100;
    return (rounded === 0 ? 0 : rounded).toString();
  }

  function showError(msg){
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
    input.classList.add('invalid');
    resetResults();
  }

  function clearError(){
    errorMsg.classList.remove('show');
    errorMsg.textContent = '';
    input.classList.remove('invalid');
  }

  function resetResults(){
    [outC, outF, outK].forEach(function(el){ el.textContent = '—'; });
    results.querySelectorAll('.result').forEach(function(r){ r.classList.add('hidden-state'); });
  }

  function updateGauge(celsius){
    // Map a practical human-relevant range for the visual fill: -40C to 60C
    var min = -40, max = 60;
    var clamped = Math.max(min, Math.min(max, celsius));
    var pct = ((clamped - min) / (max - min)) * 100;
    var isMobile = window.matchMedia('(max-width:480px)').matches;
    if(isMobile){
      gaugeFill.style.width = pct + '%';
    } else {
      gaugeFill.style.height = pct + '%';
    }
    var hue = celsius <= 0 ? '#4FA8FF' : (celsius >= 37 ? '#FF7A45' : '#B885E0');
    gaugeBulb.style.background = hue;
  }

  function runConversion(){
    var raw = input.value.trim();

    if(raw === ''){
      showError('Enter a temperature value to convert.');
      return;
    }

    if(!/^-?\d*\.?\d+$/.test(raw)){
      showError('That doesn\'t look like a number. Use digits only, e.g. -12 or 98.6.');
      return;
    }

    var value = parseFloat(raw);
    var celsius = toCelsius(value, currentUnit);

    if(celsius < -273.15){
      showError('That\'s below absolute zero (−273.15°C). No object can be colder than this — check your value.');
      return;
    }

    clearError();

    var all = fromCelsius(celsius);
    outC.textContent = formatVal(all.C) + '°';
    outF.textContent = formatVal(all.F) + '°';
    outK.textContent = formatVal(all.K);

    results.querySelectorAll('.result').forEach(function(r){ r.classList.remove('hidden-state'); });

    updateGauge(celsius);
  }

  convertBtn.addEventListener('click', runConversion);

  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      runConversion();
    }
  });

  input.addEventListener('input', function(){
    if(errorMsg.classList.contains('show')){
      clearError();
    }
  });

  // initialize gauge at a neutral room-temperature-ish state
  updateGauge(21);
})();
</script>

</body>
</html>
